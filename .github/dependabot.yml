# Actualizaciones automáticas: Dependabot abre un PR por grupo y el CI (lint, pruebas, build y
# Playwright) lo valida antes de aceptarlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Versiones menores y parches juntos en un solo PR; las mayores van por separado.
      menores:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-react todavía no admite ESLint 10.
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # jsdom 30 o superior exige Node 22.22 (el proyecto admite desde 22.13).
      - dependency-name: jsdom
        versions: [">=30"]
      # "react" y "react-dom" son alias de @preact/compat: se actualizan a mano (ver README).
      - dependency-name: react
      - dependency-name: react-dom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Imágenes de Docker del NUC (nginx, Caddy y Uptime Kuma).
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /deploy/https
      - /deploy/monitoring
    schedule:
      interval: monthly
