server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml text/plain;

    # El inicio canónico es "/": /home queda como redirección permanente.
    location ~ ^/home/?$ {
        include /etc/nginx/security-headers.conf;
        return 301 /$is_args$args;
    }

    # Una sola URL por página: /contact/ -> /contact.
    location ~ ^(.+)/$ {
        include /etc/nginx/security-headers.conf;
        return 301 $1$is_args$args;
    }

    # Archivos con hash en el nombre: se pueden guardar para siempre.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Imágenes optimizadas: también llevan hash en el nombre (scripts/optimize-images.mjs).
    location /images/optimized/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Otras imágenes (vista previa para redes): un mes de caché.
    location /images/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # HTML y demás archivos: el navegador revalida en cada visita.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
