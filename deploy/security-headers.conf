# Se incluye en cada location porque nginx no hereda add_header cuando la location define los suyos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Evita que otros sitios incrusten los recursos. Cross-Origin-Opener-Policy no va acá: el navegador
# la ignora sin HTTPS y lo informa como error en la consola; la agrega Caddy (deploy/https/Caddyfile).
add_header Cross-Origin-Resource-Policy "same-origin" always;
