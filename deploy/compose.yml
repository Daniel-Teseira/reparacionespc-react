# Sitio estático con nginx. La imagen "unprivileged" corre sin root y escucha en el puerto 8080.
services:
  web:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "192.168.1.250:3005:8080"
    volumes:
      - ../build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
    # Contenedor endurecido: sistema de archivos de solo lectura (nginx escribe solo en /tmp),
    # sin capacidades de Linux y sin posibilidad de ganar privilegios.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Registros con tope: hasta 3 archivos de 10 MB; los más viejos se descartan.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
